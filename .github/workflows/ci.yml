name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  validate:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres_test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hubday
          POSTGRES_PASSWORD: hubday
          POSTGRES_DB: hubday_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hubday -d hubday_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.0
          cache: 'pnpm'

      - name: Setup environment file
        run: cp .env.example .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Vitest unit & integration tests
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Validate Docker Compose build
        run: docker compose build
